[project]
name = "seed-kernel"
version = "1.0.13"
description = "Seed — agent kernel (seed.core) and integrations (seed.integrations)"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Seed Contributors" }]
dependencies = [
    "httpx",
    "requests>=2.28.0",
    "seed-model-providers>=1.0.0",
    "ddgs>=9.14.0",
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0", "bandit>=1.7.0"]

[project.scripts]
seed = "seed.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["seed*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "asyncio: mark a test as asyncio-driven (handled by pytest-asyncio)",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM"]
ignore = ["E501"]
