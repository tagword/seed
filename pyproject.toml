[project]
name = "seed"
version = "1.0.1"
description = "Seed — agent kernel (seed.core) and integrations (seed.integrations)"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Seed Contributors" }]
dependencies = [
    "httpx",
    "requests>=2.28.0",
    "ddgs>=9.14.0",
]

[project.optional-dependencies]
server = ["apscheduler>=3.10.0"]
dev = ["pytest>=7.0", "ruff>=0.4.0", "bandit>=1.7.0"]

[project.scripts]
seed = "seed.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["seed*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM"]
ignore = ["E501"]
